# A fleet of developer-agents tasked by email, on one bridge network.
#
#   you (browser) -> roundcube -> mailserver <- agent1, agent2 (IMAP poll / SMTP reply)
#
# Each agent reads its own mailbox and clones the SAME tenant memory repo, so a new one
# starts already knowing what the others learned about this machine. See x-agent-env.
#
# LAN-only: no external domain, no DNS, no real TLS. `agents.local` exists only inside
# this compose network. That is deliberate for the MVP — see README.

# ---- Shared agent definition ------------------------------------------------
# `x-` keys are extension fields: Compose ignores them, and the services below merge them in
# with `<<:`. One place to change a ceiling, a price or a guard for the whole fleet.
x-agent-base: &agent-base
  build: .
  depends_on:
    mailserver:
      condition: service_healthy
  restart: unless-stopped

x-agent-env: &agent-env
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}"
  DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
  # IDENTITY: two inputs, everything else derived by fleet_identity.py.
  #   dev + agent1  ->  agent1@agents.local, reviewer validator1@agents.local, id dev/agent1
  # AGENT_ADDRESS, VALIDATOR_NAME and VALIDATOR_ADDRESS are deliberately NOT set here.
  # Four independent variables for one identity is how an agent ends up reading one inbox
  # and signing as another, which nothing downstream can detect. Setting one to a value
  # that disagrees with the derivation is now a startup error, not an override.
  TENANT: "${TENANT:-dev}"
  AGENT_DOMAIN: "${AGENT_DOMAIN:-agents.local}"
  # Not derived: a secret is issued, never computed. The reviewer needs none — it only
  # ever sends, relayed on :25 by a trusted container, and has no inbox to read.
  VALIDATION_ROUNDS: "${VALIDATION_ROUNDS:-3}"
  IMAP_HOST: "mailserver"
  IMAP_PORT: "143"
  SMTP_HOST: "mailserver"
  SMTP_PORT: "25"
  POLL_SECONDS: "${POLL_SECONDS:-20}"
  MAX_STEPS: "${MAX_STEPS:-200}"
  # Spend ceilings, in USD. Measured for scale: a trivial question costs about $0.01 and a
  # real 130-step build that shipped an app cost $0.50. These sit far above that on purpose
  # — they exist to stop a runaway loop overnight, not to ration real work.
  # FLEET must stay above AGENT_DAILY: with one agent both ledgers are the same file, and
  # the fleet ceiling is the one that pauses everybody.
  # Changeable at runtime WITHOUT a restart by writing /workspace/budget.json:
  #   {"task_usd": 40, "daily_usd": 300, "fleet_daily_usd": 1000}
  # which matters here because `docker restart` keeps the env the container was created
  # with, so an env-only ceiling cannot be moved without recreating the container.
  AGENT_TASK_USD: "${AGENT_TASK_USD:-20}"
  AGENT_DAILY_USD: "${AGENT_DAILY_USD:-150}"
  FLEET_DAILY_USD: "${FLEET_DAILY_USD:-500}"
  # THE FLEET LEDGER AND KILL SWITCH MUST BE SHARED, or they are per-agent controls wearing
  # fleet names. Both default into the agent's own /workspace, which is right for one agent
  # and silently wrong for two: the "fleet" ceiling would count only the agent checking it
  # (true exposure 500 x N), and a trip that announces "All agents are now paused" would pause
  # one container. /fleet is a host directory every agent mounts. It also makes the spend
  # history outlive a workspace volume, which /workspace no longer does.
  FLEET_LEDGER: "${FLEET_LEDGER:-/fleet/spend.jsonl}"
  FLEET_PAUSE_FILE: "${FLEET_PAUSE_FILE:-/fleet/FLEET-PAUSED}"
  # Per million tokens. Estimates — the ledger stores raw token counts, so a wrong price
  # is a recomputation rather than lost data.
  PRICE_CACHE_HIT_PER_M: "${PRICE_CACHE_HIT_PER_M:-0.07}"
  PRICE_CACHE_MISS_PER_M: "${PRICE_CACHE_MISS_PER_M:-0.27}"
  PRICE_OUTPUT_PER_M: "${PRICE_OUTPUT_PER_M:-1.10}"
  # ADMISSION (agent_principal.py). Who may task this agent, and the two loop guards.
  # ALLOWED_SENDERS is "*" — anyone who can reach the mail server. That is honest about
  # today (this mail server accepts unauthenticated relay on :25) and it is why the spend
  # ceilings above are the real bound. Narrow it to "@agents.local,you@example.com" the
  # moment this box is reachable by anyone you would not hand the API key to.
  ALLOWED_SENDERS: "${ALLOWED_SENDERS:-*}"
  AGENT_MAX_HOPS: "${AGENT_MAX_HOPS:-3}"
  AGENT_MAX_THREAD_DEPTH: "${AGENT_MAX_THREAD_DEPTH:-20}"
  # The key that makes agent-to-agent messages believable. UNSET TODAY, deliberately: with
  # no key, every message claiming to come from an agent is refused, which is the correct
  # posture for a fleet with no peer traffic yet. Set it (same value on both agents) when
  # agent2 arrives. One fleet key now; FLEET_HMAC_SECRET_DEV_AGENT2 overrides per agent,
  # which is the seam the control plane grows into.
  FLEET_HMAC_SECRET: "${FLEET_HMAC_SECRET:-}"
  # AGENT-TO-AGENT MAIL (agent_peer.py). Who exists in this tenant, and who is copied on every
  # word that passes between them. The peer list is what `message_agent` validates against and
  # what lets admission refuse UNSIGNED mail from a fleet mailbox — so an agent added here but
  # not given the HMAC key can neither send nor be believed, which is the safe order.
  # The CC is not a preference: agents talking with nobody watching is the failure this
  # prevents, and it is enforced in agent_peer.send(), not in the prompt.
  FLEET_PEERS: "${FLEET_PEERS:-agent1,agent2}"
  BOSS_ADDRESS: "${BOSS_ADDRESS:-boss@agents.local}"
  # Hops bound how DEEP a chain of agent messages can go; this bounds how WIDE one task can
  # fan out. Five is generous for "ask a peer to review this" and far short of a loop.
  AGENT_MAX_PEER_SENDS: "${AGENT_MAX_PEER_SENDS:-5}"
  # MEMORY (agent_memory.py, D5). The agent's notes are a git repo outside the container,
  # which is what makes the container disposable:
  #   docker compose rm -f -v agent1 && docker compose up -d agent1
  # comes back knowing everything. /workspace becomes scratch.
  #   tenant repo  AGENT.md + AGENT-AVOID.md, shared by every agent in the tenant,
  #                plus agents/<name>/AGENT-ASSETS.md which is private to each
  #   fleet repo   FLEET.md, read-only — no agent can push it
  # UNSET DISABLES THE WHOLE THING and notes stay in /workspace exactly as before, which
  # is the rollback if this misbehaves: comment out one line and recreate the container.
  MEMORY_TENANT_REMOTE: "${MEMORY_TENANT_REMOTE:-/remotes/dev-knowledge.git}"
  MEMORY_FLEET_REMOTE: "${MEMORY_FLEET_REMOTE:-/remotes/fleet-knowledge.git}"
  # Where to tell you the app is. Must be an address YOUR browser can reach — the
  # container's own hostname is useless to you, so this is Zeenie's LAN IP.
  APP_HOST: "${APP_HOST:-192.168.0.21}"
  # Delivery: how the agent ships an app down the real CI/CD pipeline instead of leaving
  # a dev server running. Needs a PAT with `repo` AND `workflow` scope — without the
  # latter, GitHub rejects any push touching .github/workflows/ with a misleading error.
  # Unset = the agent is told delivery is unavailable and must say so rather than pretend.
  GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
  GITHUB_OWNER: "${GITHUB_OWNER:-df360-net}"
  K8S_NAMESPACE: "${K8S_NAMESPACE:-agent-apps}"
  NODE_PORT_BASE: "${NODE_PORT_BASE:-30000}"
  PROXY_PORT_BASE: "${PROXY_PORT_BASE:-31000}"
  # Local preview ports: where the agent runs an app while BUILDING it. Bounded by what
  # this container publishes below — APP_PORT_RANGE must cover BASE..BASE+COUNT-1, and
  # the worker refuses to start quietly if it does not (Compose cannot do the arithmetic,
  # so the check lives in agent_worker.main).
  # Cluster app slots — a DIFFERENT number. A preview costs a published port here; a
  # cluster slot costs only a NodePort and a listener in agent-app-proxy, so this can be
  # much larger. Must match the range agent-app-proxy publishes (31000-31019 at 20).
  APP_SLOT_COUNT: "${APP_SLOT_COUNT:-20}"

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.agents.local
    environment:
      - POSTMASTER_ADDRESS=postmaster@agents.local
      - SSL_TYPE=                      # no TLS: LAN-only MVP
      - PERMIT_DOCKER=connected-networks   # trust the bridge -> containers may relay on :25
      - ENABLE_FAIL2BAN=0
      - ENABLE_CLAMAV=0
      - ENABLE_RSPAMD=0
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - ENABLE_POLICYD_SPF=0
      - SPOOF_PROTECTION=0
      - LOG_LEVEL=info
    ports:
      - "1025:25"      # so you can drive it from the laptop (scripts/task_agent.py)
      - "1143:143"
    volumes:
      # NAMED volumes, not host paths. Zeenie is Windows: docker-mailserver's data and
      # state on a Windows bind mount breaks Postfix — postscreen dies with SIGSEGV on a
      # missing postscreen_cache.db and port 25 silently stops accepting mail. Only the
      # config dir is bind-mounted, because we author those files (and the accounts we
      # create with `setup email add` land in ./config/dms/postfix-accounts.cf, so they
      # survive a `compose down` even though the mail store does not).
      - dms-mail-data:/var/mail/
      - dms-mail-state:/var/mail-state/
      - dms-mail-logs:/var/log/mail/
      - ./config/dms/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # The image defines no healthcheck, and depends_on: service_healthy needs one.
      # Check BOTH ports: 143 alone reports healthy while Postfix is dead on 25, which is
      # exactly how the postscreen/bind-mount failure hid itself the first time.
      test: ["CMD-SHELL", "ss -lnt | grep -q ':143 ' && ss -lnt | grep -q ':25 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=25
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
    volumes:
      # Forces unauthenticated SMTP on :25. Without this Roundcube reuses your IMAP
      # credentials to AUTH, which Postfix won't offer over an unencrypted connection.
      - ./config/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
      - roundcube-db:/var/roundcube/db/     # sqlite on a Windows bind mount: same trap
    ports:
      - "8080:80"      # http://<zeenie-ip>:8080 — the user's inbox UI
    restart: unless-stopped

  # ---- The fleet -------------------------------------------------------------
  # Two agents, one shared definition. Everything that is the SAME for every agent lives in
  # the x-agent-* anchors above; a service below carries only what genuinely differs — its
  # name, its mailbox password, its preview port range and its scratch volume. Six lines.
  #
  # This is not tidiness. The alternative is a copied 80-line block, and a copied block is
  # where you change three things and miss the fourth — which is precisely the failure
  # fleet_identity.py exists to prevent one level down. Agent three is six more lines, and
  # every ceiling, price, guard and remote it inherits is inherited rather than re-typed.
  agent-worker:
    <<: *agent-base
    container_name: agent1
    environment:
      <<: *agent-env
      AGENT_NAME: "agent1"
      AGENT_PASSWORD: "${AGENT1_PASSWORD:?set AGENT1_PASSWORD in .env}"
      APP_PORT_BASE: "3000"
      APP_PORT_COUNT: "10"
      APP_PORT_RANGE: "3000-3009"
    ports:
      # Apps the agent builds live here while it tests them. One port per task, reclaimed when
      # nothing is listening. Must match APP_PORT_BASE/APP_PORT_COUNT — the worker warns at
      # startup if they disagree, because Compose cannot do the arithmetic itself.
      - "3000-3009:3000-3009"
    volumes:
      - agent1-workspace:/workspace
      - ./memory-remotes:/remotes
      - ./fleet-state:/fleet

  agent2:
    <<: *agent-base
    container_name: agent2
    environment:
      <<: *agent-env
      AGENT_NAME: "agent2"
      AGENT_PASSWORD: "${AGENT2_PASSWORD:?set AGENT2_PASSWORD in .env}"
      # A DIFFERENT preview range. Two agents publishing 3000-3009 is not a subtle failure —
      # the second container simply refuses to start with "port is already allocated".
      APP_PORT_BASE: "3010"
      APP_PORT_COUNT: "10"
      APP_PORT_RANGE: "3010-3019"
    ports:
      - "3010-3019:3010-3019"
    volumes:
      # Its own scratch. NOT its own memory: it clones the same tenant repo as agent1, so it
      # starts already knowing what agent1 learned about this machine, and writes its own
      # inventory to agents/agent2/. That inheritance is the entire point of D5, and it is
      # why standing up an agent is a compose block rather than a training period.
      - agent2-workspace:/workspace
      - ./memory-remotes:/remotes
      - ./fleet-state:/fleet

volumes:
  agent1-workspace:
  agent2-workspace:
  dms-mail-data:
  dms-mail-state:
  dms-mail-logs:
  roundcube-db:
