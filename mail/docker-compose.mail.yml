# The fleet's mail server, as it should run on hp-tiger.
#
# This is the stack lifted out of the agents' compose file and hardened for a LAN it now
# actually crosses. On zeenie it sat on a private compose bridge and only containers on that
# bridge could reach it; on hp-tiger it is reachable by anything on 192.168.0.0/24, including
# agents on the other box — which is the point, and also the reason every default below had to
# be re-examined rather than copied.
#
# THE CHANGE THAT DRIVES ALL THE OTHERS: TLS IS NOW ON.
#
# The ask was "enable SMTP AUTH so :25 stops being an open relay". Postfix will not advertise
# AUTH over an unencrypted connection — our own Roundcube config carries that note, which is
# why Roundcube currently sends unauthenticated. So SMTP AUTH is not a flag on its own: without
# TLS the server offers no AUTH mechanism, and the client falls straight back to relaying.
# Enabling one without the other produces a stack that looks authenticated and is not.
#
# Hence SSL_TYPE=self-signed. There is no real certificate for `agents.local` and there is not
# going to be one on a LAN with no public DNS. Self-signed is enough to carry AUTH and to stop
# mailbox passwords crossing the network in clear, which is the actual exposure once four
# agents on two boxes authenticate over the wire. The agents already expect exactly this:
# TLS_VERIFY defaults to false in agent_inbox and agent_outbox precisely so an unverifiable
# self-signed cert is used rather than refused.
#
# WHAT AN OPERATOR MUST NOT DO: set TLS_VERIFY=true on the agents without first giving this
# server a certificate they can chain to. Every agent stops receiving mail at once, and the
# symptom is a login failure, not a certificate error.

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.agents.local
    environment:
      - POSTMASTER_ADDRESS=postmaster@agents.local
      # See the header. Not cosmetic: without this there is no AUTH to enable.
      - SSL_TYPE=self-signed
      # REMOVED DELIBERATELY: PERMIT_DOCKER=connected-networks.
      # That is what made :25 an open relay for anything sharing the network, which was a
      # closed compose bridge on zeenie and is the whole house LAN here. With it gone, a
      # sender must authenticate — which is the entire security change being asked for.
      # If mail mysteriously stops flowing after this move, this line is the first suspect,
      # and the correct fix is credentials on the client, never putting this back.
      - ENABLE_FAIL2BAN=0
      - ENABLE_CLAMAV=0
      - ENABLE_RSPAMD=0
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - ENABLE_POLICYD_SPF=0
      # SPOOF_PROTECTION stays OFF, and this is a considered trade rather than an oversight.
      # Turning it on makes Postfix reject a MAIL FROM that does not match the authenticated
      # login — and each agent legitimately sends as TWO identities: itself, and its reviewer
      # (validator1@ etc), which is what makes a sign-off visibly not the worker grading its
      # own homework. One credential, two From addresses. Enabling it would break every
      # reviewer email the moment it was switched on.
      #
      # The residual risk is that an authenticated agent could send as another agent. That is
      # already handled where it matters: agent-to-agent decisions are made on the HMAC
      # signature, never on the From header, and agent_principal REFUSES unsigned mail that
      # claims to come from a fleet mailbox. Spoofing the header buys nothing.
      #
      # The clean fix is per-validator credentials — see mail/README.md.
      - LOG_LEVEL=info
    ports:
      # 25 — inter-server mail only. Nothing should authenticate here and, with PERMIT_DOCKER
      # gone, nothing may relay through it either.
      - "25:25"
      # 587 — SUBMISSION. This is what the agents and Roundcube use, and it requires AUTH.
      - "587:587"
      - "143:143"
      - "993:993"
    volumes:
      # NAMED volumes for mail data. The zeenie reason (a Windows bind mount breaks Postfix —
      # postscreen SIGSEGVs on a missing cache db and :25 silently stops accepting) does not
      # apply on hp-tiger's Linux filesystem, but named volumes remain the right shape: this
      # is state a container owns, not config a human authors.
      - dms-mail-data:/var/mail/
      - dms-mail-state:/var/mail-state/
      - dms-mail-logs:/var/log/mail/
      - ./config/dms/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      - mailserver
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
    volumes:
      - ./config/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
      - roundcube-db:/var/roundcube/db/
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dms-mail-data:
  dms-mail-state:
  dms-mail-logs:
  roundcube-db:
